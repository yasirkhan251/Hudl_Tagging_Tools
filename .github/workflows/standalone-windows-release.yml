name: Build Standalone Windows Release

on:
  push:
    paths:
      - "main.py"
      - "Jersey_Number_Tag.py"
      - "blocksystem.py"
      - "attack_location_2d_iteration.py"
      - "attack_location_3d.py"
      - "installer/**"
      - ".github/workflows/standalone-windows-release.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools pyinstaller
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
          python -m pip install ultralytics opencv-python easyocr vosk mss keyboard pyautogui pillow numpy scipy matplotlib pandas requests pywin32
      - name: Prepare package folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\tools | Out-Null
          Copy-Item hudl_global_config.json package\ -ErrorAction SilentlyContinue
          Copy-Item coordinates.json package\ -ErrorAction SilentlyContinue
          Copy-Item yolov8n.pt package\ -ErrorAction SilentlyContinue
          Copy-Item rtdetr-l.pt package\ -ErrorAction SilentlyContinue
      - name: Build dashboard executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HudlTaggingTools main.py
      - name: Build jersey tagger executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Jersey_Number_Tag --add-data "vosk;vosk" Jersey_Number_Tag.py
      - name: Build block tagger executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name blocksystem blocksystem.py
      - name: Build 2D attack tool executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name attack_location_2d_iteration attack_location_2d_iteration.py
      - name: Build 3D attack tool executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name attack_location_3d attack_location_3d.py
      - name: Assemble installed application
        shell: pwsh
        run: |
          Copy-Item dist\HudlTaggingTools.exe package\
          Copy-Item dist\Jersey_Number_Tag.exe package\tools\
          Copy-Item dist\blocksystem.exe package\tools\
          Copy-Item dist\attack_location_2d_iteration.exe package\tools\
          Copy-Item dist\attack_location_3d.exe package\tools\
          Copy-Item vosk package\vosk -Recurse -Force
          if (!(Test-Path package\hudl_global_config.json)) { '{}' | Set-Content package\hudl_global_config.json }
          if (!(Test-Path package\coordinates.json)) { '{}' | Set-Content package\coordinates.json }
          if (!(Test-Path package\yolov8n.pt)) { throw "yolov8n.pt is missing from repository." }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\HudlTaggingToolsStandalone.iss
          if (!(Test-Path dist\HudlTaggingToolsSetup.exe)) { throw "Installer was not produced." }
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: HudlTaggingToolsSetup-Windows
          path: dist/HudlTaggingToolsSetup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hudl Tagging Tools Release
          generate_release_notes: true
          files: dist/HudlTaggingToolsSetup.exe
